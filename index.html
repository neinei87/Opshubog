<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="OpsHubOG" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%23007AFF'/%3E%3Cstop offset='100%25' stop-color='%235856D6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='180' height='180' rx='42' fill='url(%23g)'/%3E%3Ctext x='90' y='112' font-size='76' text-anchor='middle' fill='white' font-family='-apple-system,sans-serif' font-weight='700'%3E%3E_%3C/text%3E%3C/svg%3E" />
  <title>OpsHubOG — Apple Device & App Console</title>
  <style>
    :root {
      --bg: #F2F2F7;
      --card: #FFFFFF;
      --elevated: #F8F8FA;
      --text: #111827;
      --muted: #6B7280;
      --border: #E5E7EB;
      --blue: #007AFF;
      --blue-soft: rgba(0, 122, 255, 0.12);
      --green: #34C759;
      --green-soft: rgba(52, 199, 89, 0.14);
      --amber: #FF9500;
      --amber-soft: rgba(255, 149, 0, 0.14);
      --red: #FF3B30;
      --red-soft: rgba(255, 59, 48, 0.14);
      --purple: #AF52DE;
      --purple-soft: rgba(175, 82, 222, 0.14);
      --shadow: 0 2px 10px rgba(0, 0, 0, 0.04);
      --glass: rgba(242, 242, 247, 0.88);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000;
        --card: #1C1C1E;
        --elevated: #2C2C2E;
        --text: #F9FAFB;
        --muted: #9CA3AF;
        --border: #38383A;
        --blue: #0A84FF;
        --blue-soft: rgba(10, 132, 255, 0.18);
        --green: #30D158;
        --green-soft: rgba(48, 209, 88, 0.18);
        --amber: #FF9F0A;
        --amber-soft: rgba(255, 159, 10, 0.18);
        --red: #FF453A;
        --red-soft: rgba(255, 69, 58, 0.18);
        --purple: #BF5AF2;
        --purple-soft: rgba(191, 90, 242, 0.18);
        --shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
        --glass: rgba(18, 18, 20, 0.88);
      }
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.45;
      overscroll-behavior-y: none;
    }

    code, pre, .mono {
      font-family: "SF Mono", ui-monospace, Menlo, Monaco, Consolas, monospace;
    }

    .app-wrap {
      max-width: 820px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 32px;
    }

    /* Sticky Glass Header */
    .header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: var(--glass);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border);
      padding: calc(12px + env(safe-area-inset-top)) 16px 12px;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-icon {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      background: linear-gradient(135deg, #007AFF, #5856D6);
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 16px;
      flex-shrink: 0;
      box-shadow: 0 3px 10px rgba(0, 122, 255, 0.28);
    }

    .brand-title-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .brand-title {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 0;
    }

    .brand-sub {
      font-size: 11px;
      color: var(--muted);
      margin: 1px 0 0;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 7px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .badge-amber { background: var(--amber-soft); color: var(--amber); }
    .badge-green { background: var(--green-soft); color: var(--green); }
    .badge-blue { background: var(--blue-soft); color: var(--blue); }
    .badge-red { background: var(--red-soft); color: var(--red); }
    .badge-purple { background: var(--purple-soft); color: var(--purple); }

    /* Sync Status Pill */
    .sync-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 12px;
      border-radius: 999px;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: var(--shadow);
      flex-shrink: 0;
      transition: transform 0.12s ease;
    }

    .sync-pill:active { transform: scale(0.96); }

    .sync-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #9CA3AF;
    }

    .sync-dot.synced { background: var(--green); box-shadow: 0 0 0 3px var(--green-soft); }
    .sync-dot.syncing { background: var(--amber); }
    .sync-dot.error { background: var(--red); }

    /* Search & Filter Row */
    .controls-row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .search-box {
      position: relative;
      flex: 1;
      min-width: 0;
    }

    .search-box svg {
      position: absolute;
      left: 11px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
    }

    .input, .select, .textarea {
      width: 100%;
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s ease;
    }

    .input:focus, .select:focus, .textarea:focus {
      border-color: var(--blue);
    }

    .search-input {
      padding: 9px 12px 9px 34px;
    }

    .env-select {
      width: auto;
      padding: 9px 10px;
      font-size: 12px;
      font-weight: 600;
      flex-shrink: 0;
    }

    /* Segmented Tabs */
    .tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-top: 10px;
      background: var(--elevated);
      padding: 4px;
      border-radius: 14px;
      border: 1px solid var(--border);
    }

    .tab-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 8px 6px;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      position: relative;
      transition: all 0.15s ease;
    }

    .tab-btn.active {
      background: var(--card);
      color: var(--blue);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
    }

    .tab-count {
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 999px;
      background: var(--blue-soft);
      color: var(--blue);
    }

    /* Main Content Area */
    .main {
      flex: 1;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .section-title {
      font-size: 16px;
      font-weight: 700;
      margin: 0;
    }

    .section-sub {
      font-size: 12px;
      color: var(--muted);
      margin: 2px 0 0;
    }

    /* Cards & Buttons */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 14px;
      box-shadow: var(--shadow);
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .card-title {
      font-size: 15px;
      font-weight: 700;
      margin: 0;
    }

    .card-meta {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
      word-break: break-all;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 9px 14px;
      border-radius: 12px;
      border: 1px solid transparent;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: opacity 0.15s ease, transform 0.1s ease;
    }

    .btn:active { transform: scale(0.97); }
    .btn-primary { background: var(--blue); color: #FFFFFF; }
    .btn-green { background: var(--green); color: #FFFFFF; }
    .btn-amber { background: var(--amber); color: #FFFFFF; }
    .btn-red { background: var(--red-soft); color: var(--red); border-color: rgba(255, 59, 48, 0.25); }
    .btn-ghost { background: var(--elevated); color: var(--text); border-color: var(--border); }
    .btn-sm { padding: 6px 10px; font-size: 12px; border-radius: 10px; }
    .btn-full { width: 100%; }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .chip {
      padding: 4px 9px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      background: var(--elevated);
      border: 1px solid var(--border);
      color: var(--text);
      cursor: pointer;
    }

    .chip.enabled {
      background: var(--blue-soft);
      border-color: rgba(0, 122, 255, 0.3);
      color: var(--blue);
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 12px 0;
    }

    .banner {
      padding: 12px 14px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 12px;
    }

    .banner-amber {
      background: var(--amber-soft);
      border: 1px solid rgba(255, 149, 0, 0.32);
    }

    .banner-blue {
      background: var(--blue-soft);
      border: 1px solid rgba(0, 122, 255, 0.28);
    }

    /* Footer */
    .footer {
      margin-top: auto;
      padding: 18px 16px 8px;
      text-align: center;
      font-size: 11px;
      color: var(--muted);
    }

    .link-btn {
      background: none;
      border: none;
      color: var(--blue);
      font-size: 11px;
      font-weight: 600;
      text-decoration: underline;
      cursor: pointer;
      margin-top: 6px;
    }

    /* Bottom Sheet / Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.52);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 50;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-backdrop.open { display: flex; }

    @media (min-width: 640px) {
      .modal-backdrop { align-items: center; padding: 16px; }
    }

    .modal-sheet {
      width: 100%;
      max-width: 540px;
      max-height: 88vh;
      overflow-y: auto;
      background: var(--card);
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      border: 1px solid var(--border);
      padding: 18px 18px calc(22px + env(safe-area-inset-bottom));
      box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.25);
    }

    @media (min-width: 640px) {
      .modal-sheet { border-radius: 24px; }
    }

    .form-group {
      margin-top: 12px;
    }

    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 5px;
      color: var(--muted);
    }

    .form-input {
      padding: 10px 12px;
    }

    /* Toast */
    .toast {
      position: fixed;
      top: calc(14px + env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      z-index: 70;
      background: #111827;
      color: #FFFFFF;
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
      max-width: 92vw;
      text-align: center;
      display: none;
    }

    .toast.show { display: block; }
  </style>
</head>
<body>
  <div class="app-wrap">
    <!-- Sticky Header -->
    <header class="header">
      <div class="header-top">
        <div class="brand">
          <div class="brand-icon">&gt;_</div>
          <div>
            <div class="brand-title-row">
              <h1 class="brand-title">OpsHubOG</h1>
              <span id="mode-badge" class="badge badge-amber">LOCAL</span>
            </div>
            <p class="brand-sub">Apple Device &amp; App Console</p>
          </div>
        </div>

        <button id="sync-pill-btn" class="sync-pill" type="button" onclick="openCloudSyncModal()">
          <span id="sync-dot" class="sync-dot"></span>
          <span id="sync-pill-text">Local Only</span>
        </button>
      </div>

      <!-- Search & Environment Filter -->
      <div class="controls-row">
        <div class="search-box">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input id="search-input" class="input search-input" type="text" placeholder="Filter bundles, UDIDs, containers..." oninput="setSearch(this.value)" />
        </div>
        <select id="env-select" class="select env-select" onchange="setEnvFilter(this.value)">
          <option value="ALL">All Envs</option>
          <option value="Development">Development</option>
          <option value="TestFlight">TestFlight</option>
          <option value="Production">Production</option>
        </select>
      </div>

      <!-- 4 Main Console Tabs with Inline SVGs -->
      <nav class="tabs" aria-label="Console Sections">
        <button id="tab-apps" class="tab-btn active" type="button" onclick="switchTab('apps')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
            <rect x="14" y="3" width="7" height="7" rx="1.5"></rect>
            <rect x="14" y="14" width="7" height="7" rx="1.5"></rect>
            <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
          </svg>
          <span>Apps</span>
          <span id="count-apps" class="tab-count">0</span>
        </button>

        <button id="tab-devices" class="tab-btn" type="button" onclick="switchTab('devices')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="5" y="2" width="14" height="20" rx="2.5"></rect>
            <line x1="12" y1="18" x2="12.01" y2="18"></line>
          </svg>
          <span>Devices</span>
          <span id="count-devices" class="tab-count">0</span>
        </button>

        <button id="tab-icloud" class="tab-btn" type="button" onclick="switchTab('icloud')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"></path>
          </svg>
          <span>iCloud</span>
          <span id="count-icloud" class="tab-count">0</span>
        </button>

        <button id="tab-gates" class="tab-btn" type="button" onclick="switchTab('gates')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"></path>
          </svg>
          <span>Gates</span>
          <span id="count-gates" class="tab-count">0</span>
        </button>
      </nav>
    </header>

    <!-- Main Dynamic Content -->
    <main id="main-container" class="main"></main>

    <!-- Footer -->
    <footer class="footer">
      <div>OpsHubOG Local-First Prototype • Stored in <code>localStorage</code> &amp; optional Cloud Firestore • Zero private keys or Apple ID secrets stored.</div>
      <button class="link-btn" type="button" onclick="confirmResetSeedData()">Reset Default Console Seed Data</button>
    </footer>
  </div>

  <!-- Reusable Bottom Sheet Modal -->
  <div id="modal-backdrop" class="modal-backdrop" onclick="if(event.target===this) closeModal()">
    <div id="modal-sheet" class="modal-sheet"></div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast"></div>

  <!-- Non-blocking Firebase Compat SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js" defer></script>

  <script>
    /* =========================================================================
       1. EMBEDDED DEFAULT FIREBASE CONFIG (Project: opshubog)
       ========================================================================= */
    const DEFAULT_FIREBASE_CONFIG = {
      apiKey: "AIzaSyDt9vLu7bzJWrsH_Sd1AzvNG04Ggkg72WU",
      authDomain: "opshubog.firebaseapp.com",
      projectId: "opshubog",
      storageBucket: "opshubog.firebasestorage.app",
      messagingSenderId: "865147913445",
      appId: "1:865147913445:web:28693827ecbdf41aa5c00c",
      measurementId: "G-XK6H1QRNS2"
    };

    const STORAGE_KEY = "opshubog_console_state_v2";
    const FB_CONFIG_KEY = "opshubog_firebase_config_v2";
    const META_KEY = "opshubog_sync_meta_v2";

    /* =========================================================================
       2. DEFAULT SEED DATA
       ========================================================================= */
    function getDefaultState() {
      return {
        apps: [
          {
            id: "app-1",
            name: "OpsHubOG Console",
            bundleId: "com.opshubog.console",
            version: "1.4.0 (42)",
            env: "Production",
            teamId: "9X4K2L8M1P",
            capabilities: ["Push Notifications", "Sign in with Apple", "iCloud CloudKit", "App Groups"],
            testflightReady: true
          },
          {
            id: "app-2",
            name: "FieldTelemetry iOS",
            bundleId: "com.opshubog.telemetry",

          },

          }
        ],
        devices: [
          {

            udid: "00008140-001A48922E80001C",
            profileStatus: "Active (Ad-Hoc + Dev)"
          },
          {

            udid: "00008132-0009512C1402802E",
            profileStatus: "Active (Dev)"
          },
          {

        ],

    /* =========================================================================
       3. APP STATE & STORAGE HELPERS
       ========================================================================= */
    let activeTab = "apps";
    let searchQuery = "";
    let envFilter = "ALL";
    let consoleState = loadState();

    const fbRuntime = {
      initialized: false,
      user: null,
      unsubscribe: null,
      isRemoteApply: false
    };

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return getDefaultState();
        const parsed = JSON.parse(raw);
        return {
          apps: Array.isArray(parsed.apps) ? parsed.apps : [],
          devices: Array.isArray(parsed.devices) ? parsed.devices : [],
          containers: Array.isArray(parsed.containers) ? parsed.containers : [],
          gates: Array.isArray(parsed.gates) ? parsed.gates : [],
          logs: Array.isArray(parsed.logs) ? parsed.logs : []
        };
      } catch (e) {
        return getDefaultState();
      }
    }

    function saveState(skipCloudPush) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(consoleState));
      } catch (e) {
        console.warn("localStorage save warning:", e);
      }
      renderApp();
      if (!skipCloudPush && !fbRuntime.isRemoteApply) {
        pushToFirestore();
      }
    }

    function addAuditLog(action, detail) {
      const now = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      consoleState.logs.unshift({
        id: "log-" + Date.now(),
        action,
        detail,
        time: now
      });
      if (consoleState.logs.length > 50) {
        consoleState.logs = consoleState.logs.slice(0, 50);
      }
    }

    function getSyncMeta() {
      try {
        return JSON.parse(localStorage.getItem(META_KEY)) || {};
      } catch (e) {
        return {};
      }
    }

    function setSyncMeta(patch) {
      const next = Object.assign({}, getSyncMeta(), patch);
      localStorage.setItem(META_KEY, JSON.stringify(next));
    }

    function getActiveFirebaseConfig() {
      try {
        const saved = localStorage.getItem(FB_CONFIG_KEY);
        return saved ? JSON.parse(saved) : DEFAULT_FIREBASE_CONFIG;
      } catch (e) {
        return DEFAULT_FIREBASE_CONFIG;
      }
    }

    function showToast(message) {
      const el = document.getElementById("toast");
      if (!el) return;
      el.textContent = message;
      el.classList.add("show");
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => {
        el.classList.remove("show");
      }, 3200);
    }

    function escapeHTML(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function copyText(text, label) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => {
          showToast("Copied " + label);
        }).catch(() => fallbackCopy(text, label));
      } else {
        fallbackCopy(text, label);
      }
    }

    function fallbackCopy(text, label) {
      const ta = document.createElement("textarea");
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand("copy");
        showToast("Copied " + label);
      } catch (e) {
        showToast("Copy failed");
      }
      document.body.removeChild(ta);
    }

    /* =========================================================================
       4. TAB, SEARCH, AND MAIN RENDERER

    function switchTab(tab) {
      activeTab = tab;
      ["apps", "devices", "icloud", "gates"].forEach(t => {
        const btn = document.getElementById("tab-" + t);
        if (btn) btn.classList.toggle("active", t === tab);
      });
      renderApp();

    function setSearch(val) {
      searchQuery = (val || "").trim().toLowerCase();
      renderApp();
    }

    function setEnvFilter(val) {
      envFilter = val || "ALL";
      renderApp();
    }

    function matchesFilter(textFields, envVal) {
      if (envFilter !== "ALL" && envVal && envVal !== envFilter) return false;
      if (!searchQuery) return true;
      return textFields.some(f => String(f || "").toLowerCase().includes(searchQuery));
    }

    function renderApp() {
      const pendingGates = consoleState.gates.filter(g => g.status === "Pending");
      document.getElementById("count-apps").textContent = consoleState.apps.length;
      document.getElementById("count-devices").textContent = consoleState.devices.length;
      document.getElementById("count-icloud").textContent = consoleState.containers.length;

      } else if (activeTab === "icloud") {

    /* =========================================================================
       5. CONSOLE MUTATIONS & MODALS
       ========================================================================= */
    function toggleAppCap(appId, cap) {
      const app = consoleState.apps.find(a => a.id === appId);
      if (!app) return;
      app.capabilities = app.capabilities || [];
      if (app.capabilities.includes(cap)) {
        app.capabilities = app.capabilities.filter(c => c !== cap);
      } else {
        app.capabilities.push(cap);
      }
      addAuditLog("Updated App Capability", `${app.bundleId}: toggled ${cap}`);
      saveState();
    }

    function cycleAppEnv(appId) {
      const app = consoleState.apps.find(a => a.id === appId);
      if (!app) return;
      const order = ["Development", "TestFlight", "Production"];
      const next = order[(order.indexOf(app.env) + 1) % order.length];
      if (next === "Production") {
        consoleState.gates.unshift({
          id: "gate-" + Date.now(),
          title: `Promote ${app.name} (${app.bundleId}) to Production`,
          scope: "App Store / Release",
          risk: "High",
          status: "Pending",
          requestedAt: "Just now",
          targetAppId: app.id
        });
        addAuditLog("Queued Production Gate", `${app.bundleId} awaiting operator sign-off`);
        showToast("Queued Production approval gate");
      } else {
        app.env = next;
        addAuditLog("Changed App Environment", `${app.bundleId} → ${next}`);
        showToast("Switched to " + next);
      }
      saveState();
    }

    function requestSchemaPromotion(containerId) {
      const c = consoleState.containers.find(x => x.id === containerId);
      if (!c) return;
      consoleState.gates.unshift({
        id: "gate-" + Date.now(),
        title: `Promote CloudKit Schema: ${c.identifier} → Production`,
        scope: "iCloud / CloudKit",
        risk: "High",
        status: "Pending",
        requestedAt: "Just now",
        targetContainerId: c.id
      });
      addAuditLog("Queued CloudKit Schema Gate", c.identifier);
      saveState();
      showToast("Schema promotion gate created");
    }

    function resolveGate(gateId, decision) {
      const gate = consoleState.gates.find(g => g.id === gateId);
      if (!gate) return;
      gate.status = decision;
      if (decision === "Approved") {
        if (gate.targetAppId) {
          const app = consoleState.apps.find(a => a.id === gate.targetAppId);
          if (app) app.env = "Production";
        }
        if (gate.targetContainerId) {
          const c = consoleState.containers.find(x => x.id === gate.targetContainerId);
          if (c) {
            c.env = "Production";
            c.schemaStatus = "Deployed to Production";
            c.lastSync = "Promoted just now";
          }
        }
      }
      addAuditLog(`Gate ${decision}`, gate.title);
      saveState();
      showToast(`Gate ${decision}`);
    }

    function deleteItem(collectionName, id, label) {
      consoleState[collectionName] = (consoleState[collectionName] || []).filter(x => x.id !== id);
      addAuditLog("Removed Item", `${collectionName}: ${label}`);
      saveState();
      showToast("Removed " + label);
    }

    function executeResetSeedData() {

      addAuditLog("Reset Console Data", "Restored default seed state");
      closeModal();
      saveState();
      showToast("Console reset to default seed data");
    }

    /* =========================================================================
       6. JSON EXPORT / IMPORT (iCloud Drive & Google Drive Snapshot)
       ========================================================================= */
    function exportStateJSON() {
      try {
        const blob = new Blob([JSON.stringify(consoleState, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "opshubog-backup.json";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        setSyncMeta({ lastICloudExport: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) });
        addAuditLog("Exported State Snapshot", "Downloaded opshubog-backup.json");
        saveState(true);
        showToast("Saved opshubog-backup.json — choose iCloud Drive in Files!");
      } catch (e) {
        showToast("Export failed: " + e.message);
      }
    }

    function importStateJSON(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function (e) {
        try {
          const parsed = JSON.parse(e.target.result);
          if (!parsed || !Array.isArray(parsed.apps)) {
            throw new Error("Invalid OpsHubOG backup file");
          }
          consoleState = {
            apps: parsed.apps || [],
            devices: parsed.devices || [],
            containers: parsed.containers || [],
            gates: parsed.gates || [],
            logs: parsed.logs || []
          };
          addAuditLog("Restored State Snapshot", "Imported from " + file.name);
          saveState();
          closeModal();
          showToast("Snapshot restored!");
        } catch (err) {
          showToast("Import error: " + err.message);
        }
      };
      reader.readAsText(file);
    }

    /* =========================================================================
       7. FIREBASE COMPAT AUTH + FIRESTORE MULTI-ECOSYSTEM SYNC
       ========================================================================= */
    function updateSyncPill(state, text) {
      const dot = document.getElementById("sync-dot");
      const label = document.getElementById("sync-pill-text");
      const badge = document.getElementById("mode-badge");
      if (dot) {
        dot.className = "sync-dot" + (state === "synced" ? " synced" : state === "syncing" ? " syncing" : state === "error" ? " error" : "");
      }
      if (label) label.textContent = text;
      if (badge) {
        if (state === "synced") {
          badge.className = "badge badge-green";
          badge.textContent = "CLOUD SYNCED";
        } else {
          badge.className = "badge badge-amber";
          badge.textContent = "LOCAL";
        }
      }
    }

    function initFirebaseSafely() {
      try {
        if (typeof window.firebase === "undefined") {
          updateSyncPill("local", "Local Only");
          return;
        }
        const cfg = getActiveFirebaseConfig();
        if (!cfg || !cfg.apiKey || !cfg.projectId) {
          updateSyncPill("local", "Local Only");
          return;
        }
        if (!firebase.apps.length) {
          firebase.initializeApp(cfg);
        }
        fbRuntime.initialized = true;

        // Handle redirect result (essential for iOS Safari standalone Home Screen PWA)
        firebase.auth().getRedirectResult().then(res => {
          if (res && res.user) {
            showToast("Signed in as " + (res.user.email || "Operator"));
          }
        }).catch(err => {
          console.warn("Redirect sign-in note:", err.message);
        });

        firebase.auth().onAuthStateChanged(user => {
          fbRuntime.user = user;
          if (user) {
            const shortName = user.email ? user.email.split("@")[0] : "Synced";
            updateSyncPill("syncing", "Connecting...");
            subscribeToFirestore(user, shortName);
          } else {
            if (fbRuntime.unsubscribe) {
              fbRuntime.unsubscribe();
              fbRuntime.unsubscribe = null;
            }
            updateSyncPill("local", "Local Only");
          }
          if (document.getElementById("cloud-sync-drawer")) {
            openCloudSyncModal();
          }
        });
      } catch (err) {
        console.warn("Firebase non-blocking fallback:", err);
        updateSyncPill("local", "Local Only");
      }
    }

    function subscribeToFirestore(user, shortName) {
      try {
        const db = firebase.firestore();
        const docRef = db.collection("opshubog_users").doc(user.uid);
        if (fbRuntime.unsubscribe) fbRuntime.unsubscribe();

        fbRuntime.unsubscribe = docRef.onSnapshot(
          snap => {
            updateSyncPill("synced", shortName + " • Synced");
            if (snap.exists && !snap.metadata.hasPendingWrites) {
              const data = snap.data();
              if (data && data.consoleState && Array.isArray(data.consoleState.apps)) {
                fbRuntime.isRemoteApply = true;
                consoleState = data.consoleState;
                saveState(true);
                fbRuntime.isRemoteApply = false;
              }
            } else if (!snap.exists) {
              pushToFirestore();
            }
          },
          err => {
            console.warn("Firestore listener error:", err.message);
            updateSyncPill("error", "Sync Rule/Net Err");
          }
        );
      } catch (e) {
        updateSyncPill("error", "Firestore Error");
      }
    }

    function pushToFirestore() {
      try {
        if (!fbRuntime.initialized || !fbRuntime.user) return;
        const db = firebase.firestore();
        db.collection("opshubog_users").doc(fbRuntime.user.uid).set(
          {
            consoleState,
            updatedAt: new Date().toISOString(),
            operatorEmail: fbRuntime.user.email || ""
          },
          { merge: true }
        ).catch(err => console.warn("Firestore write warning:", err.message));
      } catch (e) {
        console.warn("Firestore push skipped:", e);
      }
    }

    function signInWithProvider(providerType) {
      if (!fbRuntime.initialized) {
        showToast("Firebase SDK offline — using Local Mode");
        return;
      }
      let provider;
      if (providerType === "google") {
        provider = new firebase.auth.GoogleAuthProvider();
      } else if (providerType === "apple") {
        provider = new firebase.auth.OAuthProvider("apple.com");
        provider.addScope("email");
        provider.addScope("name");
      } else if (providerType === "github") {
        provider = new firebase.auth.GithubAuthProvider();
        provider.addScope("gist");
      }

      const isStandalonePWA = window.navigator.standalone === true || window.matchMedia("(display-mode: standalone)").matches;
      if (isStandalonePWA) {
        firebase.auth().signInWithRedirect(provider).catch(err => showToast("Auth error: " + err.message));
        return;
      }

      firebase.auth().signInWithPopup(provider).catch(err => {
        if (err && (err.code === "auth/popup-blocked" || err.code === "auth/operation-not-supported-in-this-environment")) {
          firebase.auth().signInWithRedirect(provider).catch(e2 => showToast("Auth error: " + e2.message));
        } else {
          showToast("Sign-In: " + err.message);
        }
      });
    }

    function signOutFirebase() {
      if (!fbRuntime.initialized) return;
      firebase.auth().signOut().then(() => {
        showToast("Signed out — local copy retained");
      });
    }

    async function syncToGithubGist() {
      const meta = getSyncMeta();
      const patInput = document.getElementById("github-pat-input");
      const token = (patInput && patInput.value.trim()) || meta.githubPat || "";
      if (!token) {
        showToast("Enter a GitHub Personal Access Token (gist scope) below");
        return;
      }
      setSyncMeta({ githubPat: token });
      try {
        const body = {
          description: "OpsHubOG Console State Snapshot",
          public: false,
          files: {
            "opshubog-console-state.json": {
              content: JSON.stringify(consoleState, null, 2)
            }
          }
        };
        const url = meta.githubGistId
          ? "https://api.github.com/gists/" + meta.githubGistId
          : "https://api.github.com/gists";
        const method = meta.githubGistId ? "PATCH" : "POST";
        const res = await fetch(url, {
          method,
          headers: {
            "Authorization": "Bearer " + token,
            "Accept": "application/vnd.github+json",
            "Content-Type": "application/json"
          },
          body: JSON.stringify(body)
        });
        if (!res.ok) throw new Error("GitHub API " + res.status);
        const data = await res.json();
        setSyncMeta({
          githubGistId: data.id,
          lastGithubSync: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })
        });
        addAuditLog("Synced to Private GitHub Gist", "Gist ID: " + data.id.slice(0, 10) + "...");
        saveState(true);
        showToast("Synced to Private GitHub Gist!");
        openCloudSyncModal();
      } catch (err) {
        showToast("GitHub Gist sync failed: " + err.message);
      }
    }

    function saveCustomFirebaseConfig() {
      const raw = document.getElementById("custom-fb-config").value.trim();
      if (!raw) {
        localStorage.removeItem(FB_CONFIG_KEY);
        showToast("Restored default opshubog config");
        return;
      }
      try {
        const parsed = JSON.parse(raw);
        if (!parsed.apiKey || !parsed.projectId) throw new Error("Missing apiKey or projectId");
        localStorage.setItem(FB_CONFIG_KEY, JSON.stringify(parsed));
        showToast("Saved config — reload to re-init");
      } catch (e) {
        showToast("Invalid JSON config: " + e.message);
      }
    }

    function openCloudSyncModal() {
      const user = fbRuntime.user;
      const meta = getSyncMeta();
      const cfg = getActiveFirebaseConfig();

      openModal(`
        <div id="cloud-sync-drawer">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <div>
              <h3 class="section-title">Multi-Ecosystem Cloud Sync</h3>
              <p class="section-sub">Google Firestore • Apple • GitHub Gist • iCloud Drive</p>
            </div>
            <button class="btn btn-ghost btn-sm" type="button" onclick="closeModal()">Close</button>
          </div>

          <div class="divider"></div>

          ${user ? `
            <div class="banner banner-blue" style="margin-bottom:12px;">
              <div style="min-width:0;">
                <strong>✓ Cloud Firestore Live Sync Active</strong>
                <div class="card-meta" style="color:inherit;">${escapeHTML(user.email || user.uid)}</div>
              </div>
              <button class="btn btn-ghost btn-sm" type="button" onclick="signOutFirebase()">Sign Out</button>
            </div>
          ` : `
            <div class="card" style="margin-bottom:12px;">
              <div style="font-size:13px;font-weight:600;margin-bottom:8px;">Sign In for Real-Time Cross-Device Sync</div>
              <div style="display:grid;grid-template-columns:1fr;gap:8px;">
                <button class="btn btn-primary btn-full" type="button" onclick="signInWithProvider('google')">Continue with Google (Firestore)</button>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
                  <button class="btn btn-ghost btn-full" type="button" onclick="signInWithProvider('apple')">Sign in with Apple</button>
                  <button class="btn btn-ghost btn-full" type="button" onclick="signInWithProvider('github')">Sign in with GitHub</button>
                </div>
              </div>
            </div>
          `}

          <div class="card" style="margin-bottom:10px;">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
              <div>
                <div style="font-size:13px;font-weight:700;">iCloud Drive Snapshot</div>
                <div class="card-meta">${meta.lastICloudExport ? "Last saved: " + escapeHTML(meta.lastICloudExport) : "Export/Import JSON via iOS Files app"}</div>
              </div>
              <div style="display:flex;gap:6px;">
                <button class="btn btn-green btn-sm" type="button" onclick="exportStateJSON()">Save</button>
                <label class="btn btn-ghost btn-sm" style="margin:0;">
                  Load
                  <input type="file" accept=".json,application/json" style="display:none;" onchange="importStateJSON(event)" />
                </label>
              </div>
            </div>
          </div>

          <div class="card" style="margin-bottom:10px;">
            <div style="font-size:13px;font-weight:700;">GitHub Private Gist Sync</div>
            <div class="card-meta">${meta.lastGithubSync ? "Last Gist sync: " + escapeHTML(meta.lastGithubSync) : "Push opshubog-console-state.json to private Gist"}</div>
            <div style="display:flex;gap:6px;margin-top:8px;">
              <input id="github-pat-input" class="input form-input mono" style="font-size:12px;" type="password" placeholder="ghp_... (GitHub token with gist scope)" value="${escapeHTML(meta.githubPat || "")}" />
              <button class="btn btn-primary btn-sm" type="button" onclick="syncToGithubGist()">Sync</button>
            </div>
          </div>

          <details style="margin-top:10px;">
            <summary style="font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;">Firebase Web Config (Pre-configured: opshubog)</summary>
            <div class="form-group">
              <textarea id="custom-fb-config" class="textarea form-input mono" rows="5" style="font-size:11px;">${escapeHTML(JSON.stringify(cfg, null, 2))}</textarea>
              <button class="btn btn-ghost btn-sm btn-full" style="margin-top:8px;" type="button" onclick="saveCustomFirebaseConfig()">Save Custom Config</button>
            </div>
          </details>
        </div>
      `);
    }

    /* =========================================================================
       8. BOOTSTRAP ON DOMContentLoaded
       ========================================================================= */
    document.addEventListener("DOMContentLoaded", function () {
      renderApp();
      setTimeout(initFirebaseSafely, 50);
    });
  </script>
</body>
</html>
